# Managed by ops/bin/provision.sh, loaded by needrestart after needrestart.conf.
# PostgreSQL picks up updated libraries at the next reboot (04:48 UTC when an update needs one) instead of being
# restarted by an unattended upgrade in the middle of the jobs (libc6 on 2026-10-22, zlib1g on 2026-10-24).
$nrconf{override_rc}{qr(^postgresql)} = 0;
