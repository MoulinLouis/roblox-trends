# Managed by ops/bin/provision.sh, loaded by needrestart after needrestart.conf.
# PostgreSQL picks up updated libraries at the next reboot (04:18 UTC when an update needs one) instead of being
# restarted by an unattended upgrade in the middle of the jobs (libc6 on 2026-10-22, zlib1g on 2026-10-24).
$nrconf{override_rc}{qr(^postgresql)} = 0;
# Every radar unit but radar-web is a oneshot (radar-job@, radar-job-failed@, radar-deploy, radar-backup@,
# radar-restore-test, radar-system-check): it loads the updated libraries at its next start, and a restart kills the
# run in progress (poll and explore on 2026-11-15, libc6). radar-web keeps running, so it is still restarted.
$nrconf{override_rc}{qr(^radar-(?!web\.))} = 0;
