# Managed by ops/bin/provision.sh, loaded after postgresql.conf and the settings of timescaledb-tune.
listen_addresses = 'localhost'
shared_preload_libraries = 'timescaledb'
timescaledb.telemetry_level = off
# Statements of a killed job process stop server-side instead of running to their statement_timeout.
client_connection_check_interval = '10s'
# The 5-minute poll rewrites most games rows: rarer checkpoints write fewer full-page images.
checkpoint_timeout = '15min'
max_wal_size = '4GB'
wal_compression = zstd
log_line_prefix = '%m [%p] %q%u@%d %a '
log_min_duration_statement = '5s'
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = '1min'
