name: Refresh analysis

on:
  schedule:
    - cron: "20 1,9,13,17,21 * * *"
  workflow_dispatch:

concurrency:
  group: roblox-trend-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Verify persistent database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for scheduled analysis."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run analyze
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
