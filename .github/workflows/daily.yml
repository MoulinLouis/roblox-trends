name: Analyze and report

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: roblox-trend-daily
  cancel-in-progress: false

jobs:
  analyze-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Verify persistent database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for scheduled analysis."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run analyze
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run brief
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload agent decision brief
        uses: actions/upload-artifact@v7
        with:
          name: agent-decision-brief
          path: |
            .data/reports/latest-agent-brief.md
            .data/reports/latest-agent-brief.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - run: npm run maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
