name: Collect Roblox data

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: roblox-trend-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Verify persistent database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for scheduled collection."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBLOX_COUNTRY: all
          ROBLOX_DEVICE: computer
          ROLIMONS_ENABLED: "true"
