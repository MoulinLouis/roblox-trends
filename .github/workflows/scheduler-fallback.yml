name: Scheduler fallback

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: roblox-trend-scheduler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Verify persistent database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for scheduler fallback."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROBLOX_COUNTRY: all
          ROBLOX_DEVICE: computer
          ROLIMONS_ENABLED: "true"
